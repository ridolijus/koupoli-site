name: Deploy Koupoli site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm vite build --base /koupoli-site/
      - name: Enable SPA fallback
        run: |
          for route in about projects blog post/the-illusion-of-ai-productivity; do
            mkdir -p "dist/public/$route"
            cp dist/public/index.html "dist/public/$route/index.html"
          done
          cat > dist/public/404.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>Redirecting…</title><script>const base='/koupoli-site';const route=window.location.pathname.startsWith(base)?window.location.pathname.slice(base.length):window.location.pathname;window.location.replace(base+'/?p='+encodeURIComponent(route+window.location.search+window.location.hash));</script></head><body></body></html>
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
