name: Deploy Koupoli site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm vite build --base /
      - name: Add first-party media and custom domain
        run: |
          cp -R site-assets/assets/. dist/public/assets/
          cp site-assets/CNAME dist/public/CNAME
      - name: Pre-render public pages
        run: pnpm exec tsx --tsconfig tsconfig.prerender.json scripts/prerender-static-routes.tsx
      - name: Enable SPA fallback
        run: |
          node scripts/generate-static-routes.mjs
      - name: Enforce mobile performance budget
        run: pnpm performance:check
      - name: Validate structured data
        run: node scripts/validate-structured-data.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
